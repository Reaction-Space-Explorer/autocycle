[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocycle"
version = "0.2.0"
description = "Information-rich figures for autocatalytic cycles in chemical reaction networks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Romulo Cruz-Simbron" },
    { name = "Siddhant Sharma" },
    { name = "H. James Cleaves II" },
]
keywords = ["autocatalysis", "chemical reaction networks", "origins of life", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "rdkit>=2023.3",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "networkx>=3.0",
]

[project.urls]
Homepage = "https://github.com/Reaction-Space-Explorer/autocycle"
Repository = "https://github.com/Reaction-Space-Explorer/autocycle"
Issues = "https://github.com/Reaction-Space-Explorer/autocycle/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
raster = ["cairosvg>=2.7"]

[project.scripts]
autocycle = "autocycle.cli:main"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/Makefile", "/CITATION.cff", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/autocycle"]
# the specs and small inputs travel with an install so the documented commands run; the
# figures do not, they are 2.8 MB. Listed file by file because `exclude` does not apply
# to a force-include.
[tool.hatch.build.targets.wheel.force-include]
"examples/formose_gain.yaml" = "autocycle/examples/formose_gain.yaml"
"examples/ribose_route.yaml" = "autocycle/examples/ribose_route.yaml"
"examples/edges.csv" = "autocycle/examples/edges.csv"
"examples/cypher_sample.csv" = "autocycle/examples/cypher_sample.csv"
"examples/canonical/formose_core.yaml" = "autocycle/examples/canonical/formose_core.yaml"
"examples/canonical/krebs_tca.yaml" = "autocycle/examples/canonical/krebs_tca.yaml"
"examples/canonical/acetyl_coa_sol0.yaml" = "autocycle/examples/canonical/acetyl_coa_sol0.yaml"
"examples/canonical/malyl_coa_arm.yaml" = "autocycle/examples/canonical/malyl_coa_arm.yaml"
"examples/canonical/blokhuis_core.yaml" = "autocycle/examples/canonical/blokhuis_core.yaml"
"examples/crs/example-01.crs" = "autocycle/examples/crs/example-01.crs"
"examples/crs/example-06.crs" = "autocycle/examples/crs/example-06.crs"
"examples/traced_sample" = "autocycle/examples/traced_sample"
"examples/flow_sample" = "autocycle/examples/flow_sample"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "I", "B", "SIM", "UP"]
