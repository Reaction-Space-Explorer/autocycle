  - {id: isomerise, rule: Keto-enol isomerisation}
  - {id: aldol-2, rule: Aldol addition, consumes: [{smiles: "C=O", count: 1}]}
  - id: retro-aldol
    rule: Retro-aldol cleavage
    gain: true
    mag: 2.0
    produces: [{smiles: "OCC=O", count: 1}]
