# The formose core cycle: the one abiotic autocatalytic cycle with empirical support
# (Pereto, Chem. Soc. Rev. 2012, 41, 5394). One turn consumes one glycolaldehyde and two
# formaldehyde and returns two glycolaldehyde, so n = 2.
title: Formose core cycle
seed: 0
stoichiometry_complete: true
