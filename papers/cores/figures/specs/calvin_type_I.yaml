# The Calvin cycle's type I autocatalytic core as the enumerator returns it from
# KEGG module M00165, with the module's own reaction identifiers. Structures are
# KEGG MOL blocks converted to SMILES, so nothing here is transcribed by hand.
# The fork is R00024, ribulose-bisphosphate carboxylase: one bisphosphate in, two
# glycerates out, two copies of the same compound, which is what makes it type I
# rather than type II.
title: Calvin cycle, type I core (KEGG M00165)
seed: 4
stoichiometry_complete: true
nodes:
