  - {smiles: "O=C(CO)[C@@H](O)[C@H](O)COP(=O)(O)O", label: xylulose 5-P}
  - {smiles: "O=C(CO)[C@H](O)[C@H](O)COP(=O)(O)O", label: ribulose 5-P}
  - {smiles: "O=C(COP(=O)(O)O)[C@H](O)[C@H](O)COP(=O)(O)O", label: "ribulose 1,5-bisP"}
  - {smiles: "O=C(O)[C@H](O)COP(=O)(O)O", label: 3-phosphoglycerate}
  - {smiles: "O=C(OP(=O)(O)O)[C@H](O)COP(=O)(O)O", label: "1,3-bisphosphoglycerate"}
